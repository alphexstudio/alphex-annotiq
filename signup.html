<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Create account | Alphex Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/app.css"></head>
<body class="auth" data-root=""><main class="card box"><a class="wordmark" href="login.html">Alphex <b>AI</b></a><h1>Create your account</h1><p class="mu">Set up your workspace to start annotating and evaluating.</p><p class="mu" id="mode"></p>
<form data-auth="signup">
<div class="fld"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" required ></div>
<div class="fld"><label for="organization_name">Organization name</label><input id="organization_name" name="organization_name" type="text" autocomplete="organization" required ></div>
<div class="fld"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required ></div>
<div class="fld"><label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div>
<div class="fld"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required ></div>
<p class="msg" id="msg" role="alert"></p><button class="btn pri" type="submit">Create account</button></form><div class="links"><span>Already registered?</span><a href="login.html">Sign in</a></div></main><script src="assets/js/core/config.js"></script><script src="assets/js/core/state.js"></script><script src="assets/js/core/api-client.js"></script><script src="assets/js/adapters/mock-adapter.js"></script><script src="assets/js/core/auth-service.js"></script><script src="assets/js/modules/auth-pages.js"></script></body></html>
